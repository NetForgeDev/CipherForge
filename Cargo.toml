[package]
name = "CipherForge"
version = "1.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "links", "system_fonts"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "net", "sync", "io-util", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "socks"] }
serde_json = "1"
url = "2"
base64 = "0.22"
rand = "0.9"
rfd = "0.17"
arboard = "3"
chrono = "0.4"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true